name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: PRPulse version
      description: Settings shows it at the bottom of the left column.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In Settings, open Diagnostics and press the copy button, then paste it here. It has no token, organization or pull request names.
      render: text
